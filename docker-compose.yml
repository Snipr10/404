version: "3.9"

services:
  main:
    build: ./
    command: python3 main.py
    restart: always
    tmpfs:
      - /cache:rw,size=10m

  restarter:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      sh -c "echo '0 0 * * * docker restart main' | crontab - && crond -f"
    restart: always
